name: WoW Price Monitor

on:
  schedule:
    # RED DE SEGURIDAD, no la via principal.
    #
    # La ejecucion de cada hora la dispara un cron externo llamando a la API de
    # GitHub (ver README), porque un workflow_dispatch arranca en segundos
    # mientras que un 'schedule' entra en una cola compartida y se retrasa entre
    # 20 y 40 minutos, cuando no se descarta directamente.
    #
    # Esto queda cada 3 horas para que, si el servicio externo se cae, las
    # alertas no se paren del todo: se degradan a 3 horas de latencia en vez de
    # desaparecer. Cada 3 h y no cada hora para no gastar cuota por duplicado.
    #
    # El minuto es el mismo que dispara el cron externo, un par de minutos
    # despues de que Blizzard publique el volcado de toda la region a la vez.
    #
    # Ese momento se mueve solo: el 2026-08-31 salia a las :31:22 y el
    # 2026-09-02 a las :23:30. No hace falta perseguirlo a ojo, porque cada
    # pasada mide su propio desfase y dice a que minuto conviene moverlo; cuando
    # lo cambies ahi, cambialo tambien aqui.
    - cron: '24 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar los chollos, sin avisar por Discord'
        type: boolean
        default: false

# Si una pasada se alarga, la siguiente espera en vez de solaparse: dos
# ejecuciones a la vez se pisarian la memoria de avisos.
concurrency:
  group: wow-price-monitor
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Solo para empujar los datos de la app a la rama 'datos'. El resto de la
    # pasada no escribe nada en el repositorio.
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar memoria de avisos anteriores
        uses: actions/cache/restore@v6
        with:
          path: .state
          # La clave lleva el id de ejecucion porque las caches de GitHub son
          # inmutables: cada pasada guarda una nueva y restore-keys recupera la
          # mas reciente.
          key: wow-alerts-state-${{ github.run_id }}
          restore-keys: |
            wow-alerts-state-

      - name: Buscar chollos
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          # Opcionales: con ellas, la pasada mueve sola el disparo del cron
          # cuando Blizzard cambia la hora a la que publica el volcado. Sin
          # ellas se limita a avisar por Discord de a que minuto ponerlo.
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_JOB_ID: ${{ secrets.CRONJOB_JOB_ID }}
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Vigilar mis subastas
        # Se ejecuta aunque el escaneo de chollos haya ido mal: son dos
        # vigilancias independientes y una no debe silenciar a la otra.
        #
        # Undercuts y ventas van juntos a proposito, y no en pasos separados:
        # comparten la descarga, y sobre todo el seguimiento de ventas tiene que
        # actualizarse TODAS las horas, se venda o no, porque cada pasada afina
        # las fechas de caducidad de las que sigue.
        if: '!cancelled()'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UNDERCUT_WEBHOOK_URL: ${{ secrets.DISCORD_UNDERCUT_WEBHOOK_URL }}
          DISCORD_VENTAS_WEBHOOK_URL: ${{ secrets.DISCORD_VENTAS_WEBHOOK_URL }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python main.py --undercut --ventas ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publicar datos para la app
        # Los ficheros que lee la app del movil: el catalogo de objetos y el
        # precio a batir en cada reino donde vendes. Se van a una rama aparte
        # para no ensuciar el historial de main con un commit por hora.
        #
        # Va despues de las alertas y con !cancelled() porque es lo menos
        # urgente de la pasada: si falla, las alertas ya han salido.
        if: '!cancelled() && !inputs.dry_run'
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: python datos_app.py --salida publicar

      - name: Subir los datos de la app
        if: '!cancelled() && !inputs.dry_run && hashFiles('publicar/**') != '''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd publicar
          git init -q
          git remote add origin             "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # La rama puede no existir todavia, y eso no es un error.
          git fetch --depth=1 origin datos 2>/dev/null || true
          git checkout -B datos
          git add -A
          # Sin cambios no hay commit: 'commit' devolveria 1 y tumbaria el paso.
          git diff --cached --quiet && echo "Sin cambios que publicar." && exit 0
          git commit -q -m "Datos de la app: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force origin datos

      - name: Guardar memoria de avisos
        # Tambien cuando el escaneo va mal: lo ya avisado sigue siendo valido y
        # no queremos repetirlo en la pasada siguiente.
        #
        # El hashFiles evita un aviso feo cuando no hay nada que guardar, que es
        # lo que pasa en las pasadas con --dry-run: no escriben estado.
        if: always() && hashFiles('.state/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .state
          key: wow-alerts-state-${{ github.run_id }}
