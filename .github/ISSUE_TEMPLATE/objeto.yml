# ============================================================================
#  Anadir un objeto vigilado
# ----------------------------------------------------------------------------
#  El camino normal es el boton de la app, que genera este mismo cuerpo. Esta
#  plantilla existe para cuando la app no esta a mano.
#
#  Las etiquetas de los campos son el contrato con anadir_objeto.py, que es
#  quien lee el cuerpo de la issue. Si cambias una, cambiala tambien alli y en
#  Objetos.kt.
#
#  El desplegable de "Copiar topes de" no existe: sus opciones serian los
#  objetos de config.yaml y habria que regenerar la plantilla cada vez, como
#  pasa con tope.yml. Aqui se escribe el nombre.
# ============================================================================

name: Anadir un objeto
description: Empieza a vigilar un objeto que todavia no esta en config.yaml.
title: "Objeto: "
labels: [objeto]
body:
  - type: markdown
    attributes:
      value: |
        Para algo recien salido, pega el **enlace de Wowhead**: no depende de
        escribir bien el nombre en ingles.

        Las mascotas y las monturas se siguen anadiendo a mano en `config.yaml`.

  - type: input
    id: objeto
    attributes:
      label: Objeto
      description: El enlace de Wowhead, el id, o el nombre exacto en ingles.
      placeholder: "https://www.wowhead.com/item=258126"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - "Equipo (tabla por ilvl)"
        - "Patron o receta (precio unico)"
    validations:
      required: true

  - type: input
    id: copiar
    attributes:
      label: Copiar topes de
      description: >-
        Solo para equipo: el nombre en ingles de una pieza que ya vigiles, de la
        que copiar la tabla de precios por ilvl.
      placeholder: "Venom Rite Mantle"
    validations:
      required: false

  - type: input
    id: tope
    attributes:
      label: Tope, en oro
      description: "Solo para patrones y recetas."
      placeholder: "40000"
    validations:
      required: false
