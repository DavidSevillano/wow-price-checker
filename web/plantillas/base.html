<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Auction Sentinel{% endblock %}</title>
  <meta name="description" content="{% block descripcion %}{% endblock %}">
  <link rel="stylesheet" href="/estaticos/estilo.css">
</head>
<body>
  <nav class="nav">
    <a class="marca" href="/">AUCTION SENTINEL</a>
    {# GET y no POST a proposito: asi cada busqueda es una URL que se puede
       compartir, marcar y --si algun dia interesa-- indexar. #}
    <form class="buscar" action="/search" method="get" role="search">
      <input type="search" name="q" placeholder="Search items"
             aria-label="Search items" value="{{ q or '' }}">
    </form>
    <a class="nav-enlace" href="/items">Browse</a>
  </nav>
  {% block contenido %}{% endblock %}
  <footer class="pie">
    Prices from the EU auction house, refreshed hourly.
    Not affiliated with Blizzard Entertainment.
  </footer>
</body>
</html>
